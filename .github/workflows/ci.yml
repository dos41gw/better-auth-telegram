name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
        better-auth-version: [1.7.0, 1.7.6]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Better Auth matrix version
        run: bun add --dev --exact better-auth@${{ matrix.better-auth-version }} @better-auth/core@${{ matrix.better-auth-version }} --ignore-scripts

      - name: Type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.better-auth-version == '1.7.6'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-bun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [test, test-bun]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        run: |
          {
            echo "## Build Artifacts"
            echo "| File | Size |"
            echo "|------|------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/index.js dist/index.cjs dist/index.d.ts dist/index.d.cts \
                   dist/client.js dist/client.cjs dist/client.d.ts dist/client.d.cts; do
            test -f "$f" || { echo "::error::Missing artifact: $f"; exit 1; }
            SIZE=$(wc -c < "$f" | tr -d ' ')
            echo "| $f | ${SIZE}B |" >> "$GITHUB_STEP_SUMMARY"
          done

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint
